name: Release macOS

on:
  release:
    types: [published]
  push:
    branches: [mac-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build DMG
        working-directory: 源码
        run: |
          npm ci
          npm run dist:mac

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/standard/line puppy-*-Mac-arm64.dmg
            dist/standard/line puppy-*-Mac-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish macOS release
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2-mac
          name: line puppy v1.2.2 macOS (Apple Silicon)
          make_latest: "false"
          body: |
            macOS Apple Silicon 版（M1 / M2 / M3 / M4 等 arm64 机型，macOS 12 Monterey 及以上）。
            打开 DMG 后将 line puppy 拖入 Applications 即可安装。
            首次打开若提示无法验证开发者，按住 Control 点击应用并选择“打开”，或执行 `xattr -cr "/Applications/line puppy.app"`。
          files: |
            dist/standard/line puppy-*-Mac-arm64.dmg
            dist/standard/line puppy-*-Mac-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
